<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Match</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffd700">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ============================================ -->
  <!-- PAGE 1: START PAGE                          -->
  <!-- ============================================ -->
  <div id="start-page" class="page active">
    <div class="start-content">
      <div class="logo-container">
        <div class="logo-animation">
          <span>🎴</span>
          <span>🧠</span>
          <span>🎯</span>
        </div>
      </div>
      <h1 class="game-title">Memory Match</h1>
      <p class="tagline">Test your memory. Find the pairs.</p>
      <button id="play-btn" class="btn-primary">▶ Play</button>
      <button id="install-btn-start" style="display:none; margin-top: 10px;" class="btn-primary">📲 Install App</button>
      <p class="version">v2.0</p>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- PAGE 2: SETUP PAGE                         -->
  <!-- ============================================ -->
  <div id="setup-page" class="page">
    <div class="setup-content">
      <h2>⚙️ Game Setup</h2>

      <div class="setup-group">
        <label>Mode</label>
        <div class="option-group" id="mode-options">
          <button class="option-btn active" data-value="classic">🎯 Classic</button>
          <button class="option-btn" data-value="timed">⏱️ Timed</button>
          <button class="option-btn" data-value="zen">🧘 Zen</button>
        </div>
      </div>

      <div class="setup-group">
        <label>Difficulty</label>
        <div class="option-group" id="difficulty-options">
          <button class="option-btn" data-value="easy">Easy (4×4)</button>
          <button class="option-btn active" data-value="medium">Medium (4×6)</button>
          <button class="option-btn" data-value="hard">Hard (6×6)</button>
        </div>
      </div>

      <div class="setup-group">
        <label>Theme</label>
        <div class="option-group" id="theme-options">
          <button class="option-btn" data-value="animals">🐾 Animals</button>
          <button class="option-btn active" data-value="food">🍕 Food</button>
          <button class="option-btn" data-value="flags">🏳️ Flags</button>
          <button class="option-btn" data-value="nature">🌿 Nature</button>
        </div>
      </div>

      <button id="start-game-btn" class="btn-primary">🚀 Start Game</button>
      <button id="back-to-start-btn" class="btn-secondary">← Back</button>
      <button id="install-btn-setup" style="display:none; margin-top: 10px;" class="btn-primary">📲 Install App</button>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- PAGE 3: GAME PAGE                         -->
  <!-- ============================================ -->
  <div id="game-page" class="page">
    <div class="game-container">
      <!-- Stats -->
      <div class="game-stats">
        <div class="stat-item">
          <span class="stat-label">Moves</span>
          <span class="stat-value" id="moves">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Time</span>
          <span class="stat-value" id="timer">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Best</span>
          <span class="stat-value" id="best-score">—</span>
        </div>
      </div>

      <!-- Game Board -->
      <div id="game-board-wrapper">
        <div id="game-board"></div>
      </div>

      <!-- Power-ups -->
      <div class="powerups">
        <button id="peek-btn" class="powerup-btn" disabled>👀 Peek (2)</button>
        <button id="time-btn" class="powerup-btn" disabled>⏱️ +5s (2)</button>
        <button id="hint-btn" class="powerup-btn" disabled>💡 Hint (1)</button>
      </div>

      <!-- Controls -->
      <div class="game-controls">
        <button id="reset-btn" class="btn-primary">🔄 New Game</button>
        <button id="back-to-setup-btn" class="btn-secondary">← Setup</button>
      </div>

      <!-- Install button on game page -->
      <button id="install-btn" style="display:none; margin-top: 15px; width: 100%;" class="btn-primary">📲 Install App</button>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- SCRIPTS                                     -->
  <!-- ============================================ -->

  <!-- Game logic -->
  <script src="app.js"></script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/memory-match/sw.js')
        .then(() => console.log('✅ Service Worker registered'))
        .catch((err) => console.error('❌ Service Worker registration failed:', err));
    }
  </script>

  <!-- Install Prompt Handler -->
  <script>
    let deferredPrompt;
    const installBtnStart = document.getElementById('install-btn-start');
    const installBtnSetup = document.getElementById('install-btn-setup');
    const installBtnGame = document.getElementById('install-btn');
    const allInstallBtns = [installBtnStart, installBtnSetup, installBtnGame].filter(b => b !== null);

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      console.log('✅ Install prompt ready');
      allInstallBtns.forEach(btn => btn.style.display = 'block');
    });

    allInstallBtns.forEach(btn => {
      btn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const result = await deferredPrompt.userChoice;
          console.log(`User chose: ${result.outcome}`);
          deferredPrompt = null;
          allInstallBtns.forEach(b => b.style.display = 'none');
        }
      });
    });

    window.addEventListener('appinstalled', () => {
      console.log('✅ App installed');
      allInstallBtns.forEach(btn => btn.style.display = 'none');
    });
  </script>

</body>
</html>
